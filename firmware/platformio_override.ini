; Firmware del cuervo: WLED 16.0.1 oficial para ESP32-C3 + dos módulos.
;   Cuervo_Estado ........... los ojos avisan el paso de la configuración (propio, en usermods/)
;   Internal_Temperature_v2 . publica la temperatura interna del chip (oficial de WLED)
; Compilar con:  firmware/compilar.sh   (copia esto a una copia limpia de WLED v16.0.1)

[platformio]
default_envs = cuervo

[env:cuervo]
extends = env:esp32c3dev
custom_usermods = audioreactive Internal_Temperature_v2 Cuervo_Estado
